<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="/logo.svg" rel="icon" type="image/svg+xml"/>
  <script>
    (() => {
      const mode = localStorage.getItem('family-manager.theme-mode')
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.dataset.theme = mode === 'light' || mode === 'dark' ? mode : systemDark ? 'dark' : 'light'
      const accent = localStorage.getItem('family-manager.theme-accent')
      if (accent && /^#[\da-f]{6}$/i.test(accent)) {
        document.documentElement.style.setProperty('--accent-seed', accent)
      }
    })()
  </script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
  <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
  />
  <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block"
      rel="stylesheet"
  />
  <title>Family Manager</title>
</head>
<body>
<div id="root"></div>
<script src="/src/main.tsx" type="module"></script>
</body>
</html>
