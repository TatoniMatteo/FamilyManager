server {
    listen 80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name localhost;
    ssl_certificate /etc/nginx/local-certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/local-certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 500 502 503 504 /outage.html;

    location /api/ {
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /outage.html;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_pass http://core:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mailpit {
        return 308 /mailpit/;
    }

    location /mailpit/ {
        proxy_pass http://mailpit:8025/mailpit/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /outage.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location /oauth2/ {
        proxy_pass http://core:8080/oauth2/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login/oauth2/ {
        proxy_pass http://core:8080/login/oauth2/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /swagger {
        proxy_pass http://core:8080/swagger;
        proxy_set_header Host $host;
    }

    location /api-docs {
        proxy_pass http://core:8080/api-docs;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
